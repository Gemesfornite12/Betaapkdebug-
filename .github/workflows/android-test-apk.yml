name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Beta-app--main/**'
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Beta-app--main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run connector and media-routing unit tests
        run: gradle testDebugUnitTest --tests com.example.data.api.GroqWorkspaceConnectorTest --tests com.example.ui.viewmodel.GroqMediaRoutingTest --stacktrace

      - name: Upload compile-test APK (24h)
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-compile-test-debug-apk
          path: Beta-app--main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
